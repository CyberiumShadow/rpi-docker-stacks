services:
  wallos:
    container_name: wallos
    image: bellamy/wallos:latest
    environment:
      TZ: 'Australia/Melbourne'
    # Volumes store your data between container upgrades
    volumes:
      - 'db:/var/www/html/db'
      - 'logos:/var/www/html/images/uploads/logos'
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.wallos.entrypoints=websecure"
      - "traefik.http.routers.wallos.rule=Host(`wallos.cyberiumshadow.xyz`)"
      - "traefik.http.routers.wallos.tls=true"
      - "traefik.http.services.wallos.loadbalancer.server.port=80"
      - "traefik.docker.network=traefik"
      - "flame.type=application" # "app" works too
      - "flame.name=actual"
      - "flame.url=https://wallos.cyberiumshadow.xyz"

networks:
  traefik:
    external: true

volumes:
  db:
  logos:
