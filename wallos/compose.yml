services:
  wallos:
    container_name: wallos
    image: bellamy/wallos:latest
    environment:
      TZ: 'Australia/Melbourne'
      OIDC_ENABLED: "true"
      OIDC_PROVIDER_NAME: "${OIDC_PROVIDER_NAME}"
      OIDC_CLIENT_ID: "${OIDC_CLIENT_ID}"
      OIDC_CLIENT_SECRET: "${OIDC_CLIENT_SECRET}"
      OIDC_ISSUER: "${OIDC_ISSUER}"
      OIDC_REDIRECT_URL: "https://wallos.cyberiumshadow.xyz/login.php"
      OIDC_USER_IDENTIFIER: "email"
      OIDC_SCOPES: "openid profile email"
      OIDC_AUTO_CREATE_USER: "true"
      OIDC_DISABLE_PASSWORD_LOGIN: "true"
      OIDC_REQUIRE_EMAIL_VERIFIED: "true"
      SSRF_ALLOWLIST: "id.cyberiumshadow.xyz"
    networks:
      - traefik
    # Volumes store your data between container upgrades
    volumes:
      - 'db:/var/www/html/db'
      - 'logos:/var/www/html/images/uploads/logos'
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.wallos.entrypoints=websecure"
      - "traefik.http.routers.wallos.rule=Host(`wallos.cyberiumshadow.xyz`)"
      - "traefik.http.routers.wallos.tls=true"
      - "traefik.http.services.wallos.loadbalancer.server.port=80"
      - "traefik.docker.network=traefik"
      - "flame.type=application" # "app" works too
      - "flame.name=actual"
      - "flame.url=https://wallos.cyberiumshadow.xyz"

networks:
  traefik:
    external: true

volumes:
  db:
  logos:
