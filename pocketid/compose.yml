services:
  pocket-id:
    image: pocketid/pocket-id:v2
    restart: unless-stopped
    environment:
      APP_URL: "${APP_URL}"
      ENCRYPTION_KEY: "${ENCRYPTION_KEY}"
      TRUST_PROXY: "${TRUST_PROXY:-false}"
      PROXY_PROTOCOL: "${PROXY_PROTOCOL:-false}"
      TRUSTED_PLATFORM: "${TRUSTED_PLATFORM:-}"
      ALLOW_INSECURE_CALLBACK_URLS: "${ALLOW_INSECURE_CALLBACK_URLS:-false}"
      MAXMIND_LICENSE_KEY: "${MAXMIND_LICENSE_KEY:-}"
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
    networks:
      - traefik
    volumes:
      - "data:/app/data"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pocketid.entrypoints=websecure"
      - "traefik.http.routers.pocketid.rule=Host(`id.cyberiumshadow.xyz`)"
      - "traefik.http.routers.pocketid.tls=true"
      - "traefik.http.services.pocketid.loadbalancer.server.port=1411"
      - "traefik.docker.network=traefik"
      - "flame.type=application" # "app" works too
      - "flame.name=actual"
      - "flame.url=https://id.cyberiumshadow.xyz"
    healthcheck:
      test: ["CMD", "/app/pocket-id", "healthcheck"]
      interval: 1m30s
      timeout: 5s
      retries: 2
      start_period: 10s

  tinyauth:
    image: ghcr.io/tinyauthapp/tinyauth:v5
    restart: unless-stopped
    environment:
        TINYAUTH_APPURL: "${TINYAUTH_APPURL}"
        TINYAUTH_AUTH_TRUSTEDPROXIES: "${TINYAUTH_AUTH_TRUSTEDPROXIES:-172.16.0.0/12}"
        TINYAUTH_OAUTH_PROVIDERS_POCKETID_CLIENTID: "${POCKETID_CLIENT_ID}"
        TINYAUTH_OAUTH_PROVIDERS_POCKETID_CLIENTSECRET: "${POCKETID_CLIENT_SECRET}"
        TINYAUTH_OAUTH_PROVIDERS_POCKETID_AUTHURL: "${POCKETID_URL}/authorize"
        TINYAUTH_OAUTH_PROVIDERS_POCKETID_TOKENURL: "${POCKETID_URL}/api/oidc/token"
        TINYAUTH_OAUTH_PROVIDERS_POCKETID_USERINFOURL: "${POCKETID_URL}/api/oidc/userinfo"
        TINYAUTH_OAUTH_PROVIDERS_POCKETID_REDIRECTURL: "${TINYAUTH_APPURL}/api/oauth/callback/pocketid"
        TINYAUTH_OAUTH_PROVIDERS_POCKETID_SCOPES: "${POCKETID_SCOPES:-openid email profile groups}"
        TINYAUTH_OAUTH_PROVIDERS_POCKETID_NAME: "${POCKETID_NAME:-Pocket ID}"
        TINYAUTH_OAUTH_AUTOREDIRECT: "pocketid"
    networks:
      - traefik
    labels:
        - "traefik.enable=true"
        - "traefik.docker.network=traefik"
        - "traefik.http.routers.tinyauth.rule=Host(`${TINYAUTH_HOST}`)"
        - "traefik.http.routers.tinyauth.entrypoints=websecure"
        - "traefik.http.routers.tinyauth.tls=true"
        - "traefik.http.services.tinyauth.loadbalancer.server.port=3000"
        - "traefik.http.middlewares.tinyauth.forwardauth.address=http://tinyauth:3000/api/auth/traefik"
        - "flame.type=application"
        - "flame.name=TinyAuth"
        - "flame.url=${TINYAUTH_APPURL}"

networks:
  traefik:
    external: true

volumes:
  data:
