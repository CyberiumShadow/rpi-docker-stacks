services:
  homeassistant:
    container_name: homeassistant
    image: "ghcr.io/home-assistant/home-assistant:stable"
    volumes:
      - homeassistant_config:/config
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro
    restart: unless-stopped
    privileged: true
    network_mode: host
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.homeassistant.entrypoints=websecure"
      - "traefik.http.routers.homeassistant.rule=Host(`homeassistant.cyberiumshadow.xyz`)"
      - "traefik.http.routers.homeassistant.tls=true"
      - "traefik.http.services.homeassistant.loadbalancer.server.url=http://192.168.20.249:8123"
      - "traefik.docker.network=traefik"
      - "flame.type=application" # "app" works too
      - "flame.name=Home Assistant"
      - "flame.url=https://homeassistant.cyberiumshadow.xyz"
  
  matterjs-server:
    container_name: matterjs-server
    image: ghcr.io/matter-js/matterjs-server:latest
    read_only: true
    restart: unless-stopped
    network_mode: host
    volumes:
      - matter_data:/data

  emhass:
    container_name: emhass
    image: ghcr.io/davidusb-geek/emhass:latest
    restart: unless-stopped
    environment:
      TZ: Australia/Melbourne
    ports:
      - "192.168.20.249:5000:5000"
    volumes:
      - emhass_config:/share
      - emhass_data:/data
    secrets:
      - source: emhass_secrets
        target: /app/secrets_emhass.yaml
    labels:
      - "flame.type=application"
      - "flame.name=EMHASS"
      - "flame.url=http://192.168.20.249:5000"

secrets:
  emhass_secrets:
    environment: EMHASS_SECRETS

volumes:
  homeassistant_config:
    name: homeassistant_config
  matter_data:
  emhass_config:
    name: emhass_config
  emhass_data:
    name: emhass_data
